[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "frag"
version = "0.1.0"
description = "FRAG: Fair Retrieval-Augmented Generation for LLM-based Sequential Recommendation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pyarrow>=16,<20",
  "PyYAML>=6,<7",
  "scipy>=1.12,<2",
  "torch>=2.3,<3",
  "tqdm>=4.66,<5"
]

[project.optional-dependencies]
llm = [
  "accelerate>=0.33,<2",
  "huggingface-hub>=0.24,<1",
  "peft>=0.12,<1",
  "safetensors>=0.4,<1",
  "transformers>=4.44,<5"
]
test = [
  "pytest>=8,<9",
  "ruff>=0.6,<1"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
